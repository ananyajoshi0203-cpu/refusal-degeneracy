[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "refusal-degeneracy"
version = "0.1.0"
description = "Testing whether neuron-level LLM safety defenses survive refusal-direction ablation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "torch>=2.2",
    "transformers>=4.51",
    "accelerate",
    "datasets",
    "huggingface_hub",
    "numpy",
    "pandas",
    "tqdm",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
judge = ["bitsandbytes"]

[tool.setuptools.packages.find]
include = ["refusal_degeneracy*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E741"]
